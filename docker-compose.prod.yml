version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: leos-database-prod
    environment:
      POSTGRES_DB: leos
      POSTGRES_USER: ${DB_USER:-leos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leos123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/production/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - leos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leos}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CMIS Repository
  cmis-repository:
    image: chemistry/chemistry-opencmis-server:1.1.0
    container_name: leos-cmis-prod
    environment:
      JAVA_OPTS: "-Xmx4g -Xms2g"
    volumes:
      - cmis_data:/chemistry-opencmis-server/data
    networks:
      - leos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/chemistry-opencmis-server/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LEOS Services (Spring Boot)
  leos-services:
    image: ${DOCKER_REGISTRY:-ghcr.io/your-org}/leos-services:${LEOS_VERSION:-latest}
    container_name: leos-services-prod
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - LEOS_DB_URL=jdbc:postgresql://database:5432/leos
      - LEOS_CMIS_URL=http://cmis-repository:8080/chemistry-opencmis-server/
      - ANNOTATE_SERVER_URL=http://annotate-server:9099
      - JAVA_OPTS=-Xmx4g -Xms2g -XX:+UseG1GC
    depends_on:
      database:
        condition: service_healthy
      cmis-repository:
        condition: service_healthy
    networks:
      - leos-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'

  # Annotation Server
  annotate-server:
    image: ${DOCKER_REGISTRY:-ghcr.io/your-org}/annotate-server:${LEOS_VERSION:-latest}
    container_name: leos-annotate-server-prod
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - LEOS_DB_URL=jdbc:postgresql://database:5432/leos
      - JAVA_OPTS=-Xmx2g -Xms1g -XX:+UseG1GC
    depends_on:
      database:
        condition: service_healthy
    networks:
      - leos-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'

  # LEOS UI (Nginx serving Angular)
  leos-ui:
    image: ${DOCKER_REGISTRY:-ghcr.io/your-org}/leos-ui:${LEOS_VERSION:-latest}
    container_name: leos-ui-prod
    networks:
      - leos-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Annotation Client (Nginx serving Angular)
  annotate-client:
    image: ${DOCKER_REGISTRY:-ghcr.io/your-org}/annotate-client:${LEOS_VERSION:-latest}
    container_name: leos-annotate-client-prod
    networks:
      - leos-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: leos-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/production/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/production/nginx-prod.conf:/etc/nginx/conf.d/default.conf
      - ./docker/production/ssl:/etc/nginx/ssl
    depends_on:
      - leos-services
      - leos-ui
      - annotate-server
      - annotate-client
    networks:
      - leos-network
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: leos-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - leos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: leos-prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./docker/production/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - leos-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana for monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: leos-grafana-prod
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/production/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/production/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - leos-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  cmis_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  leos-network:
    driver: bridge 
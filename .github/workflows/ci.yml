name: LEOS CI/CD Pipeline

on:
  push:
    branches: [main, staging, production]
  pull_request:
    branches: [main]

env:
  LEOS_VERSION: ${{ github.sha }}
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    name: Test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: |
            leos/modules/ui-angular/node_modules
            annotate/client-angular/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm

      - name: Run backend tests
        run: |
          cd leos
          ./mvnw test -Dspring.profiles.active=test

      - name: Run frontend tests
        run: |
          cd leos/modules/ui-angular
          npm ci
          npm test -- --watch=false

      - name: Run annotation tests
        run: |
          cd annotate
          ./mvnw test -Dspring.profiles.active=test
          cd client-angular
          npm ci
          npm test -- --watch=false

  build:
    name: Build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push LEOS Services
        uses: docker/build-push-action@v5
        with:
          context: ./leos
          file: ./docker/production/Dockerfile.leos-services
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/leos-services:${{ env.LEOS_VERSION }}

      - name: Build and push LEOS UI
        uses: docker/build-push-action@v5
        with:
          context: ./leos/modules/ui-angular
          file: ./docker/production/Dockerfile.leos-ui
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/leos-ui:${{ env.LEOS_VERSION }}

      - name: Build and push Annotation Server
        uses: docker/build-push-action@v5
        with:
          context: ./annotate
          file: ./docker/production/Dockerfile.annotate-server
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/annotate-server:${{ env.LEOS_VERSION }}

      - name: Build and push Annotation Client
        uses: docker/build-push-action@v5
        with:
          context: ./annotate/client-angular
          file: ./docker/production/Dockerfile.annotate-client
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/annotate-client:${{ env.LEOS_VERSION }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment logic here
          # This could be deploying to a staging server or cloud environment

  deploy-production:
    name: Deploy to Production
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: build
    if: github.ref == 'refs/heads/production'
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment logic here
          # This could be deploying to your GCP environment
